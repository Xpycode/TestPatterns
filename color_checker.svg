<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Color Checker Chart</title>
  <desc>24-patch color reference chart similar to X-Rite ColorChecker for color calibration</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#606060"/>

  <!-- Color patches arranged in 4 rows of 6 patches each -->
  <!-- Each patch is 200x200 pixels with 40 pixel spacing -->

  <!-- Row 1: Natural colors -->
  <!-- Dark Skin -->
  <rect x="220" y="140" width="200" height="200" fill="#735244"/>
  <text x="320" y="365" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Dark Skin</text>

  <!-- Light Skin -->
  <rect x="460" y="140" width="200" height="200" fill="#C29682"/>
  <text x="560" y="365" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Light Skin</text>

  <!-- Blue Sky -->
  <rect x="700" y="140" width="200" height="200" fill="#627A9D"/>
  <text x="800" y="365" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Blue Sky</text>

  <!-- Foliage -->
  <rect x="940" y="140" width="200" height="200" fill="#576C43"/>
  <text x="1040" y="365" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Foliage</text>

  <!-- Blue Flower -->
  <rect x="1180" y="140" width="200" height="200" fill="#8580B1"/>
  <text x="1280" y="365" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Blue Flower</text>

  <!-- Bluish Green -->
  <rect x="1420" y="140" width="200" height="200" fill="#67BDAA"/>
  <text x="1520" y="365" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Blu-Green</text>

  <!-- Row 2: Saturated colors -->
  <!-- Orange -->
  <rect x="220" y="400" width="200" height="200" fill="#D67E2C"/>
  <text x="320" y="625" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Orange</text>

  <!-- Purplish Blue -->
  <rect x="460" y="400" width="200" height="200" fill="#505BA6"/>
  <text x="560" y="625" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Purple-Blue</text>

  <!-- Moderate Red -->
  <rect x="700" y="400" width="200" height="200" fill="#C15A63"/>
  <text x="800" y="625" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Mod. Red</text>

  <!-- Purple -->
  <rect x="940" y="400" width="200" height="200" fill="#5E3C6C"/>
  <text x="1040" y="625" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Purple</text>

  <!-- Yellow Green -->
  <rect x="1180" y="400" width="200" height="200" fill="#9DBC40"/>
  <text x="1280" y="625" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Yellow-Grn</text>

  <!-- Orange Yellow -->
  <rect x="1420" y="400" width="200" height="200" fill="#E0A32E"/>
  <text x="1520" y="625" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Orange-Yel</text>

  <!-- Row 3: Primary and secondary colors -->
  <!-- Blue -->
  <rect x="220" y="660" width="200" height="200" fill="#383D96"/>
  <text x="320" y="885" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Blue</text>

  <!-- Green -->
  <rect x="460" y="660" width="200" height="200" fill="#469449"/>
  <text x="560" y="885" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Green</text>

  <!-- Red -->
  <rect x="700" y="660" width="200" height="200" fill="#AF363C"/>
  <text x="800" y="885" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Red</text>

  <!-- Yellow -->
  <rect x="940" y="660" width="200" height="200" fill="#E7C71F"/>
  <text x="1040" y="885" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Yellow</text>

  <!-- Magenta -->
  <rect x="1180" y="660" width="200" height="200" fill="#B84D7E"/>
  <text x="1280" y="885" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Magenta</text>

  <!-- Cyan -->
  <rect x="1420" y="660" width="200" height="200" fill="#00A4B5"/>
  <text x="1520" y="885" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">Cyan</text>

  <!-- Row 4: Grayscale -->
  <!-- White -->
  <rect x="220" y="920" width="200" height="120" fill="#F3F3F2"/>
  <text x="320" y="1025" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">White</text>

  <!-- Neutral 8 -->
  <rect x="460" y="920" width="200" height="120" fill="#C8C8C8"/>
  <text x="560" y="1025" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">N8 (80%)</text>

  <!-- Neutral 6.5 -->
  <rect x="700" y="920" width="200" height="120" fill="#A0A0A0"/>
  <text x="800" y="1025" font-family="monospace" font-size="14" fill="#000000" text-anchor="middle">N6.5 (65%)</text>

  <!-- Neutral 5 -->
  <rect x="940" y="920" width="200" height="120" fill="#7A7A79"/>
  <text x="1040" y="1025" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">N5 (50%)</text>

  <!-- Neutral 3.5 -->
  <rect x="1180" y="920" width="200" height="120" fill="#555555"/>
  <text x="1280" y="1025" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">N3.5 (35%)</text>

  <!-- Black -->
  <rect x="1420" y="920" width="200" height="120" fill="#343434"/>
  <text x="1520" y="1025" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">Black</text>

  <!-- Title -->
  <text x="960" y="60" font-family="Arial, sans-serif" font-size="42" fill="#FFFFFF" text-anchor="middle" font-weight="bold">COLOR CHECKER CHART</text>
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="20" fill="#CCCCCC" text-anchor="middle">24-patch reference chart for camera color calibration</text>
</svg>
