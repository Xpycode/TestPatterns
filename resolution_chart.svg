<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Resolution Test Chart</title>
  <desc>High-resolution test pattern with various line widths for sharpness testing</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#808080"/>

  <!-- White background for test area -->
  <rect x="60" y="100" width="1800" height="900" fill="#FFFFFF"/>

  <!-- Horizontal line pairs at different frequencies -->
  <g id="horizontalLines">
    <!-- 1 pixel lines -->
    <line x1="100" y1="150" x2="400" y2="150" stroke="#000000" stroke-width="1"/>
    <line x1="100" y1="152" x2="400" y2="152" stroke="#000000" stroke-width="1"/>
    <line x1="100" y1="156" x2="400" y2="156" stroke="#000000" stroke-width="1"/>
    <line x1="100" y1="158" x2="400" y2="158" stroke="#000000" stroke-width="1"/>
    <line x1="100" y1="162" x2="400" y2="162" stroke="#000000" stroke-width="1"/>
    <line x1="100" y1="164" x2="400" y2="164" stroke="#000000" stroke-width="1"/>
    <text x="250" y="180" font-family="monospace" font-size="14" text-anchor="middle">1px lines (2px pitch)</text>

    <!-- 2 pixel lines -->
    <line x1="100" y1="210" x2="400" y2="210" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="214" x2="400" y2="214" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="218" x2="400" y2="218" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="222" x2="400" y2="222" stroke="#000000" stroke-width="2"/>
    <line x1="100" y1="226" x2="400" y2="226" stroke="#000000" stroke-width="2"/>
    <text x="250" y="245" font-family="monospace" font-size="14" text-anchor="middle">2px lines (4px pitch)</text>

    <!-- 3 pixel lines -->
    <line x1="100" y1="275" x2="400" y2="275" stroke="#000000" stroke-width="3"/>
    <line x1="100" y1="281" x2="400" y2="281" stroke="#000000" stroke-width="3"/>
    <line x1="100" y1="287" x2="400" y2="287" stroke="#000000" stroke-width="3"/>
    <line x1="100" y1="293" x2="400" y2="293" stroke="#000000" stroke-width="3"/>
    <text x="250" y="315" font-family="monospace" font-size="14" text-anchor="middle">3px lines (6px pitch)</text>
  </g>

  <!-- Vertical line pairs -->
  <g id="verticalLines">
    <!-- 1 pixel vertical lines -->
    <line x1="500" y1="150" x2="500" y2="350" stroke="#000000" stroke-width="1"/>
    <line x1="502" y1="150" x2="502" y2="350" stroke="#000000" stroke-width="1"/>
    <line x1="506" y1="150" x2="506" y2="350" stroke="#000000" stroke-width="1"/>
    <line x1="508" y1="150" x2="508" y2="350" stroke="#000000" stroke-width="1"/>
    <line x1="512" y1="150" x2="512" y2="350" stroke="#000000" stroke-width="1"/>
    <line x1="514" y1="150" x2="514" y2="350" stroke="#000000" stroke-width="1"/>
    <text x="507" y="375" font-family="monospace" font-size="14" text-anchor="middle">1px</text>

    <!-- 2 pixel vertical lines -->
    <line x1="560" y1="150" x2="560" y2="350" stroke="#000000" stroke-width="2"/>
    <line x1="564" y1="150" x2="564" y2="350" stroke="#000000" stroke-width="2"/>
    <line x1="568" y1="150" x2="568" y2="350" stroke="#000000" stroke-width="2"/>
    <line x1="572" y1="150" x2="572" y2="350" stroke="#000000" stroke-width="2"/>
    <line x1="576" y1="150" x2="576" y2="350" stroke="#000000" stroke-width="2"/>
    <text x="568" y="375" font-family="monospace" font-size="14" text-anchor="middle">2px</text>

    <!-- 3 pixel vertical lines -->
    <line x1="620" y1="150" x2="620" y2="350" stroke="#000000" stroke-width="3"/>
    <line x1="626" y1="150" x2="626" y2="350" stroke="#000000" stroke-width="3"/>
    <line x1="632" y1="150" x2="632" y2="350" stroke="#000000" stroke-width="3"/>
    <line x1="638" y1="150" x2="638" y2="350" stroke="#000000" stroke-width="3"/>
    <text x="629" y="375" font-family="monospace" font-size="14" text-anchor="middle">3px</text>
  </g>

  <!-- Checkerboard patterns at different sizes -->
  <g id="checkerboards">
    <!-- 4x4 pixel checkerboard -->
    <rect x="750" y="150" width="4" height="4" fill="#000000"/>
    <rect x="754" y="150" width="4" height="4" fill="#FFFFFF"/>
    <rect x="758" y="150" width="4" height="4" fill="#000000"/>
    <rect x="762" y="150" width="4" height="4" fill="#FFFFFF"/>
    <rect x="754" y="154" width="4" height="4" fill="#000000"/>
    <rect x="758" y="154" width="4" height="4" fill="#FFFFFF"/>
    <rect x="762" y="154" width="4" height="4" fill="#000000"/>
    <rect x="750" y="154" width="4" height="4" fill="#FFFFFF"/>
    <!-- Repeat pattern -->
    <rect x="750" y="158" width="4" height="4" fill="#000000"/>
    <rect x="754" y="158" width="4" height="4" fill="#FFFFFF"/>
    <rect x="758" y="158" width="4" height="4" fill="#000000"/>
    <rect x="762" y="158" width="4" height="4" fill="#FFFFFF"/>
    <rect x="754" y="162" width="4" height="4" fill="#000000"/>
    <rect x="758" y="162" width="4" height="4" fill="#FFFFFF"/>
    <rect x="762" y="162" width="4" height="4" fill="#000000"/>
    <rect x="750" y="162" width="4" height="4" fill="#FFFFFF"/>
    <text x="758" y="180" font-family="monospace" font-size="12" text-anchor="middle">4px</text>

    <!-- 8x8 pixel checkerboard -->
    <rect x="780" y="150" width="8" height="8" fill="#000000"/>
    <rect x="788" y="150" width="8" height="8" fill="#FFFFFF"/>
    <rect x="796" y="150" width="8" height="8" fill="#000000"/>
    <rect x="804" y="150" width="8" height="8" fill="#FFFFFF"/>
    <rect x="788" y="158" width="8" height="8" fill="#000000"/>
    <rect x="796" y="158" width="8" height="8" fill="#FFFFFF"/>
    <rect x="804" y="158" width="8" height="8" fill="#000000"/>
    <rect x="780" y="158" width="8" height="8" fill="#FFFFFF"/>
    <rect x="780" y="166" width="8" height="8" fill="#000000"/>
    <rect x="788" y="166" width="8" height="8" fill="#FFFFFF"/>
    <rect x="796" y="166" width="8" height="8" fill="#000000"/>
    <rect x="804" y="166" width="8" height="8" fill="#FFFFFF"/>
    <rect x="788" y="174" width="8" height="8" fill="#000000"/>
    <rect x="796" y="174" width="8" height="8" fill="#FFFFFF"/>
    <rect x="804" y="174" width="8" height="8" fill="#000000"/>
    <rect x="780" y="174" width="8" height="8" fill="#FFFFFF"/>
    <text x="792" y="195" font-family="monospace" font-size="12" text-anchor="middle">8px</text>
  </g>

  <!-- Corner detail markers (for focus check) -->
  <g id="corners">
    <rect x="100" y="420" width="100" height="100" fill="#000000"/>
    <rect x="105" y="425" width="90" height="90" fill="#FFFFFF"/>
    <rect x="110" y="430" width="80" height="80" fill="#000000"/>
    <rect x="115" y="435" width="70" height="70" fill="#FFFFFF"/>
    <rect x="120" y="440" width="60" height="60" fill="#000000"/>
    <text x="150" y="540" font-family="monospace" font-size="12" text-anchor="middle">Corner</text>

    <rect x="1720" y="420" width="100" height="100" fill="#000000"/>
    <rect x="1725" y="425" width="90" height="90" fill="#FFFFFF"/>
    <rect x="1730" y="430" width="80" height="80" fill="#000000"/>
    <rect x="1735" y="435" width="70" height="70" fill="#FFFFFF"/>
    <rect x="1740" y="440" width="60" height="60" fill="#000000"/>
    <text x="1770" y="540" font-family="monospace" font-size="12" text-anchor="middle">Corner</text>

    <rect x="100" y="860" width="100" height="100" fill="#000000"/>
    <rect x="105" y="865" width="90" height="90" fill="#FFFFFF"/>
    <rect x="110" y="870" width="80" height="80" fill="#000000"/>
    <rect x="115" y="875" width="70" height="70" fill="#FFFFFF"/>
    <rect x="120" y="880" width="60" height="60" fill="#000000"/>
    <text x="150" y="975" font-family="monospace" font-size="12" text-anchor="middle">Corner</text>

    <rect x="1720" y="860" width="100" height="100" fill="#000000"/>
    <rect x="1725" y="865" width="90" height="90" fill="#FFFFFF"/>
    <rect x="1730" y="870" width="80" height="80" fill="#000000"/>
    <rect x="1735" y="875" width="70" height="70" fill="#FFFFFF"/>
    <rect x="1740" y="880" width="60" height="60" fill="#000000"/>
    <text x="1770" y="975" font-family="monospace" font-size="12" text-anchor="middle">Corner</text>
  </g>

  <!-- Center detail -->
  <g id="centerDetail">
    <circle cx="960" cy="540" r="200" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="960" cy="540" r="190" fill="none" stroke="#000000" stroke-width="1"/>
    <circle cx="960" cy="540" r="180" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="960" cy="540" r="170" fill="none" stroke="#000000" stroke-width="1"/>
    <circle cx="960" cy="540" r="160" fill="none" stroke="#000000" stroke-width="2"/>

    <line x1="760" y1="540" x2="1160" y2="540" stroke="#000000" stroke-width="2"/>
    <line x1="960" y1="340" x2="960" y2="740" stroke="#000000" stroke-width="2"/>

    <circle cx="960" cy="540" r="10" fill="#000000"/>
    <circle cx="960" cy="540" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="960" y="50" font-family="Arial, sans-serif" font-size="36" fill="#000000" text-anchor="middle" font-weight="bold">RESOLUTION TEST CHART</text>
  <text x="960" y="85" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle">Test sharpness, resolution, and focus uniformity</text>
</svg>
