<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>SMPTE RP 219:2002 - Pattern 3 (Y Ramp)</title>
  <desc>SMPTE RP 219:2002 HD Pattern 3 - Luminance ramp signal for bit-level testing</desc>

  <defs>
    <!-- Luminance gradient from black to white -->
    <linearGradient id="yRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left side panel: 100% Yellow (16:9 side panel) -->
  <rect x="0" y="0" width="240" height="1080" fill="#FFFF00"/>

  <!-- 4:3 safe area components (240 to 1680) -->
  <!-- Left: 0% Black -->
  <rect x="240" y="0" width="120" height="1080" fill="#000000"/>

  <!-- Center: Y Ramp (luminance gradient) -->
  <rect x="360" y="0" width="1200" height="1080" fill="url(#yRamp)"/>

  <!-- Right: 100% White -->
  <rect x="1560" y="0" width="120" height="1080" fill="#FFFFFF"/>

  <!-- Right side panel: 100% Red (16:9 side panel) -->
  <rect x="1680" y="0" width="240" height="1080" fill="#FF0000"/>

  <!-- 4:3 safe area border indicators -->
  <line x1="240" y1="0" x2="240" y2="1080" stroke="#808080" stroke-width="2" stroke-dasharray="10,5"/>
  <line x1="1680" y1="0" x2="1680" y2="1080" stroke="#808080" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- Internal divisions for clarity -->
  <line x1="360" y1="0" x2="360" y2="1080" stroke="#404040" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1560" y1="0" x2="1560" y2="1080" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Labels -->
  <text x="120" y="540" font-family="Arial, sans-serif" font-size="28" fill="#000000" text-anchor="middle" font-weight="bold" transform="rotate(-90 120 540)">100% YELLOW</text>

  <text x="300" y="540" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold" transform="rotate(-90 300 540)">0% BLACK</text>

  <text x="960" y="540" font-family="Arial, sans-serif" font-size="64" fill="#808080" text-anchor="middle" font-weight="bold">Y RAMP</text>
  <text x="960" y="610" font-family="Arial, sans-serif" font-size="28" fill="#808080" text-anchor="middle">0% → 100%</text>

  <text x="1620" y="540" font-family="Arial, sans-serif" font-size="20" fill="#000000" text-anchor="middle" font-weight="bold" transform="rotate(-90 1620 540)">100% WHITE</text>

  <text x="1800" y="540" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold" transform="rotate(-90 1800 540)">100% RED</text>

  <!-- Title -->
  <rect x="360" y="20" width="1200" height="80" fill="#000000" opacity="0.6"/>
  <text x="960" y="60" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SMPTE RP 219:2002 - PATTERN 3</text>
  <text x="960" y="90" font-family="Arial, sans-serif" font-size="20" fill="#CCCCCC" text-anchor="middle">Luminance Ramp Signal (Y Ramp) - Bit-Level Testing</text>

  <!-- Bottom label -->
  <rect x="360" y="1000" width="1200" height="60" fill="#000000" opacity="0.6"/>
  <text x="960" y="1040" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">Linear gradient for checking specific bit failures in digital processing</text>

  <!-- 4:3 safe area labels -->
  <text x="240" y="540" font-family="monospace" font-size="14" fill="#AAAAAA" text-anchor="middle" transform="rotate(-90 240 540)">4:3 Safe Area Start</text>
  <text x="1680" y="540" font-family="monospace" font-size="14" fill="#AAAAAA" text-anchor="middle" transform="rotate(-90 1680 540)">4:3 Safe Area End</text>
</svg>
