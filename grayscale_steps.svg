<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Grayscale Steps</title>
  <desc>21-step grayscale pattern for gamma, brightness, and contrast calibration</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#808080"/>

  <!-- 21 grayscale steps from black to white -->
  <rect x="0" y="190" width="96" height="700" fill="#000000"/>     <!-- 0% -->
  <rect x="96" y="190" width="96" height="700" fill="#0D0D0D"/>    <!-- 5% -->
  <rect x="192" y="190" width="96" height="700" fill="#1A1A1A"/>   <!-- 10% -->
  <rect x="288" y="190" width="96" height="700" fill="#262626"/>   <!-- 15% -->
  <rect x="384" y="190" width="96" height="700" fill="#333333"/>   <!-- 20% -->
  <rect x="480" y="190" width="96" height="700" fill="#404040"/>   <!-- 25% -->
  <rect x="576" y="190" width="96" height="700" fill="#4D4D4D"/>   <!-- 30% -->
  <rect x="672" y="190" width="96" height="700" fill="#595959"/>   <!-- 35% -->
  <rect x="768" y="190" width="96" height="700" fill="#666666"/>   <!-- 40% -->
  <rect x="864" y="190" width="96" height="700" fill="#737373"/>   <!-- 45% -->
  <rect x="960" y="190" width="96" height="700" fill="#808080"/>   <!-- 50% -->
  <rect x="1056" y="190" width="96" height="700" fill="#8C8C8C"/>  <!-- 55% -->
  <rect x="1152" y="190" width="96" height="700" fill="#999999"/>  <!-- 60% -->
  <rect x="1248" y="190" width="96" height="700" fill="#A6A6A6"/>  <!-- 65% -->
  <rect x="1344" y="190" width="96" height="700" fill="#B3B3B3"/>  <!-- 70% -->
  <rect x="1440" y="190" width="96" height="700" fill="#BFBFBF"/>  <!-- 75% -->
  <rect x="1536" y="190" width="96" height="700" fill="#CCCCCC"/>  <!-- 80% -->
  <rect x="1632" y="190" width="96" height="700" fill="#D9D9D9"/>  <!-- 85% -->
  <rect x="1728" y="190" width="96" height="700" fill="#E6E6E6"/>  <!-- 90% -->
  <rect x="1824" y="190" width="96" height="700" fill="#F2F2F2"/>  <!-- 95% -->
  <rect x="1920" y="190" width="96" height="700" fill="#FFFFFF"/>  <!-- 100% -->

  <!-- Labels -->
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="48" fill="#000000" text-anchor="middle" font-weight="bold">GRAYSCALE STEPS</text>
  <text x="960" y="150" font-family="Arial, sans-serif" font-size="24" fill="#000000" text-anchor="middle">21 steps - 0% to 100% in 5% increments</text>

  <!-- Step labels -->
  <text x="48" y="950" font-family="monospace" font-size="18" fill="#FFFFFF" text-anchor="middle">0%</text>
  <text x="480" y="950" font-family="monospace" font-size="18" fill="#FFFFFF" text-anchor="middle">25%</text>
  <text x="960" y="950" font-family="monospace" font-size="18" fill="#000000" text-anchor="middle">50%</text>
  <text x="1440" y="950" font-family="monospace" font-size="18" fill="#000000" text-anchor="middle">75%</text>
  <text x="1872" y="950" font-family="monospace" font-size="18" fill="#000000" text-anchor="middle">100%</text>
</svg>
