<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>SMPTE RP 219:2002 - Pattern 4 (PLUGE)</title>
  <desc>SMPTE RP 219:2002 HD Pattern 4 - PLUGE signal for picture monitor brightness adjustment</desc>

  <!-- Background: Reference black (0%) -->
  <rect x="0" y="0" width="1920" height="1080" fill="#101010"/>

  <!-- Left side panel: 100% Cyan (16:9 side panel) -->
  <rect x="0" y="0" width="240" height="1080" fill="#00FFFF"/>

  <!-- 4:3 safe area: PLUGE pattern (240 to 1680 = 1440 pixels wide) -->
  <!-- Each PLUGE bar is 288 pixels wide (1440 / 5 = 288) -->

  <!-- Bar 1: -2% (Super Black) -->
  <rect x="240" y="0" width="288" height="1080" fill="#050505"/>

  <!-- Bar 2: 0% (Reference Black) -->
  <rect x="528" y="0" width="288" height="1080" fill="#101010"/>

  <!-- Bar 3: +2% (Slightly Above Black) -->
  <rect x="816" y="0" width="288" height="1080" fill="#151515"/>

  <!-- Bar 4: 0% (Reference Black) -->
  <rect x="1104" y="0" width="288" height="1080" fill="#101010"/>

  <!-- Bar 5: +4% (Above Black) -->
  <rect x="1392" y="0" width="288" height="1080" fill="#1A1A1A"/>

  <!-- Right side panel: 100% Blue (16:9 side panel) -->
  <rect x="1680" y="0" width="240" height="1080" fill="#0000FF"/>

  <!-- 4:3 safe area border indicators -->
  <line x1="240" y1="0" x2="240" y2="1080" stroke="#606060" stroke-width="2" stroke-dasharray="10,5"/>
  <line x1="1680" y1="0" x2="1680" y2="1080" stroke="#606060" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- Dividing lines between PLUGE bars -->
  <line x1="528" y1="0" x2="528" y2="1080" stroke="#202020" stroke-width="1" opacity="0.5"/>
  <line x1="816" y1="0" x2="816" y2="1080" stroke="#202020" stroke-width="1" opacity="0.5"/>
  <line x1="1104" y1="0" x2="1104" y2="1080" stroke="#202020" stroke-width="1" opacity="0.5"/>
  <line x1="1392" y1="0" x2="1392" y2="1080" stroke="#202020" stroke-width="1" opacity="0.5"/>

  <!-- Labels for PLUGE bars -->
  <text x="384" y="540" font-family="Arial, sans-serif" font-size="32" fill="#808080" text-anchor="middle" font-weight="bold">-2%</text>
  <text x="384" y="580" font-family="monospace" font-size="16" fill="#606060" text-anchor="middle">Super Black</text>

  <text x="672" y="540" font-family="Arial, sans-serif" font-size="32" fill="#909090" text-anchor="middle" font-weight="bold">0%</text>
  <text x="672" y="580" font-family="monospace" font-size="16" fill="#707070" text-anchor="middle">Ref. Black</text>

  <text x="960" y="540" font-family="Arial, sans-serif" font-size="32" fill="#A0A0A0" text-anchor="middle" font-weight="bold">+2%</text>
  <text x="960" y="580" font-family="monospace" font-size="16" fill="#808080" text-anchor="middle">Above Black</text>

  <text x="1248" y="540" font-family="Arial, sans-serif" font-size="32" fill="#909090" text-anchor="middle" font-weight="bold">0%</text>
  <text x="1248" y="580" font-family="monospace" font-size="16" fill="#707070" text-anchor="middle">Ref. Black</text>

  <text x="1536" y="540" font-family="Arial, sans-serif" font-size="32" fill="#B0B0B0" text-anchor="middle" font-weight="bold">+4%</text>
  <text x="1536" y="580" font-family="monospace" font-size="16" fill="#909090" text-anchor="middle">Above Black</text>

  <!-- Side panel labels -->
  <text x="120" y="540" font-family="Arial, sans-serif" font-size="28" fill="#000000" text-anchor="middle" font-weight="bold" transform="rotate(-90 120 540)">100% CYAN</text>
  <text x="1800" y="540" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold" transform="rotate(-90 1800 540)">100% BLUE</text>

  <!-- Title -->
  <rect x="240" y="20" width="1440" height="100" fill="#000000" opacity="0.8"/>
  <text x="960" y="60" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SMPTE RP 219:2002 - PATTERN 4</text>
  <text x="960" y="95" font-family="Arial, sans-serif" font-size="22" fill="#CCCCCC" text-anchor="middle">PLUGE - Picture Line-Up Generation Equipment</text>

  <!-- Instructions -->
  <rect x="340" y="680" width="1240" height="320" fill="#000000" opacity="0.85" rx="10"/>
  <text x="960" y="730" font-family="Arial, sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold">BRIGHTNESS CALIBRATION GUIDE</text>

  <text x="960" y="780" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" text-anchor="middle">1. Adjust BRIGHTNESS until -2% bar is completely invisible</text>
  <text x="960" y="810" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" text-anchor="middle">2. The 0% reference black bars should be just barely visible</text>
  <text x="960" y="840" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" text-anchor="middle">3. The +2% bar should be slightly but clearly visible</text>
  <text x="960" y="870" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" text-anchor="middle">4. The +4% bar should be distinctly visible, brighter than +2%</text>

  <text x="960" y="920" font-family="Arial, sans-serif" font-size="16" fill="#AAAAAA" text-anchor="middle" font-style="italic">View in a darkened room for best results</text>

  <text x="960" y="960" font-family="monospace" font-size="14" fill="#888888" text-anchor="middle">PLUGE sequence: -2%, 0%, +2%, 0%, +4%</text>

  <!-- 4:3 safe area labels -->
  <text x="240" y="30" font-family="monospace" font-size="14" fill="#808080">4:3 Safe</text>
  <text x="1620" y="30" font-family="monospace" font-size="14" fill="#808080" text-anchor="end">4:3 Safe</text>
</svg>
