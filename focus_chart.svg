      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(310)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(320)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(330)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(340)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(350)"/>

      <!-- Center circle -->
      <circle cx="0" cy="0" r="30" fill="#000000"/>
      <circle cx="0" cy="0" r="20" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="10" fill="#000000"/>
    </g>

    <circle cx="960" cy="540" r="250" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

