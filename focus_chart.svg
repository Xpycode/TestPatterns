      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(190)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(200)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(210)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(220)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(230)"/>
