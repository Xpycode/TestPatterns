  <!-- Title -->
  <text x="960" y="50" font-family="Arial, sans-serif" font-size="36" fill="#000000" text-anchor="middle" font-weight="bold">FOCUS TEST CHART</text>
  <text x="960" y="85" font-family="Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle">Siemens star patterns for testing focus accuracy and sharpness</text>
  <text x="960" y="1050" font-family="Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle">Check focus uniformity across the frame - all stars should be equally sharp</text>
