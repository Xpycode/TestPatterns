<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Focus Chart</title>
  <desc>Focus test chart with star patterns and high-contrast edges</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#808080"/>

  <!-- White background -->
  <rect x="60" y="100" width="1800" height="900" fill="#FFFFFF"/>

  <!-- Star pattern (Siemens star) - center -->
  <g id="centerStar">
    <!-- 72 rays = 5 degrees each -->
    <g transform="translate(960, 540)">
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(0)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(10)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(20)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(30)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(40)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(50)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(60)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(70)"/>
      <polygon points="0,-250 5,0 -5,0" fill="#000000" transform="rotate(80)"/>
