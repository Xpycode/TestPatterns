<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Alignment and Registration Pattern</title>
  <desc>Alignment marks and registration crosses for positioning, framing, and aspect ratio testing</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#404040"/>

  <!-- Safe area guides -->
  <!-- Action safe (90%) - outer -->
  <rect x="96" y="54" width="1728" height="972" fill="none" stroke="#00FF00" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="960" y="40" font-family="monospace" font-size="16" fill="#00FF00" text-anchor="middle">Action Safe (90%)</text>

  <!-- Title safe (80%) - inner -->
  <rect x="192" y="108" width="1536" height="864" fill="none" stroke="#FFFF00" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="960" y="95" font-family="monospace" font-size="16" fill="#FFFF00" text-anchor="middle">Title Safe (80%)</text>

  <!-- Outer border (full frame) -->
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#FF0000" stroke-width="4"/>

  <!-- Center crosshair (large) -->
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Center registration cross -->
  <line x1="910" y1="540" x2="1010" y2="540" stroke="#FF0000" stroke-width="4"/>
  <line x1="960" y1="490" x2="960" y2="590" stroke="#FF0000" stroke-width="4"/>
  <circle cx="960" cy="540" r="40" fill="none" stroke="#FF0000" stroke-width="3"/>
  <circle cx="960" cy="540" r="5" fill="#FF0000"/>

  <!-- Corner registration marks -->
  <!-- Top-left -->
  <line x1="0" y1="60" x2="120" y2="60" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="60" y1="0" x2="60" y2="120" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="60" cy="60" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Top-right -->
  <line x1="1800" y1="60" x2="1920" y2="60" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="1860" y1="0" x2="1860" y2="120" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1860" cy="60" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Bottom-left -->
  <line x1="0" y1="1020" x2="120" y2="1020" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="60" y1="960" x2="60" y2="1080" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="60" cy="1020" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Bottom-right -->
  <line x1="1800" y1="1020" x2="1920" y2="1020" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="1860" y1="960" x2="1860" y2="1080" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1860" cy="1020" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Mid-edge registration marks -->
  <!-- Top center -->
  <line x1="960" y1="0" x2="960" y2="80" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="960" cy="80" r="15" fill="none" stroke="#00FFFF" stroke-width="2"/>

  <!-- Bottom center -->
  <line x1="960" y1="1000" x2="960" y2="1080" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="960" cy="1000" r="15" fill="none" stroke="#00FFFF" stroke-width="2"/>

  <!-- Left center -->
  <line x1="0" y1="540" x2="80" y2="540" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="80" cy="540" r="15" fill="none" stroke="#00FFFF" stroke-width="2"/>

  <!-- Right center -->
  <line x1="1840" y1="540" x2="1920" y2="540" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="1840" cy="540" r="15" fill="none" stroke="#00FFFF" stroke-width="2"/>

  <!-- Aspect ratio markers -->
  <!-- 16:9 markers (native) -->
  <text x="100" y="30" font-family="monospace" font-size="20" fill="#FF0000">16:9</text>
  <text x="1780" y="30" font-family="monospace" font-size="20" fill="#FF0000">16:9</text>

  <!-- Resolution indicator -->
  <text x="960" y="540" font-family="Arial, sans-serif" font-size="72" fill="#FFFFFF" text-anchor="middle" dy="150">1920 × 1080</text>
  <text x="960" y="540" font-family="Arial, sans-serif" font-size="36" fill="#CCCCCC" text-anchor="middle" dy="190">Full HD / 1080p</text>

  <!-- Title -->
  <text x="960" y="150" font-family="Arial, sans-serif" font-size="42" fill="#FFFFFF" text-anchor="middle" font-weight="bold">ALIGNMENT &amp; REGISTRATION</text>

  <!-- Instructions -->
  <text x="960" y="920" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" text-anchor="middle">Red border = Full frame | Green dashed = Action safe | Yellow dashed = Title safe</text>
  <text x="960" y="945" font-family="Arial, sans-serif" font-size="16" fill="#BBBBBB" text-anchor="middle">Use corner and edge marks for alignment and to verify aspect ratio</text>
</svg>
